services:
  - type: web
    name: churntrackai
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_API_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: LLM_DAILY_LIMIT
        value: "50"
      - key: DATABASE_URL
        value: sqlite:////app/runtime/churn.db
